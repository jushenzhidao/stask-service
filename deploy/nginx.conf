# nginx 共域名分流样例（设计 §7）
#
# 关键点：/async/ 前缀走 stask-service，其余全部原样走 new-api。
# 对客户端而言就是「同一个域名，加个前缀就变异步」。

upstream newapi_backend {
    server newapi:3000;
    keepalive 32;
}

upstream stask_backend {
    server stask:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.com;

    # 出图请求体可能带 b64 参考图，放宽到 8MB（须 ≥ BODY_MAX_BYTES）
    client_max_body_size 8m;

    # ---- 异步任务网关 ----
    location /async/ {
        proxy_pass http://stask_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 【安全防线 1】无条件覆盖客户端同名头。
        # proxy_set_header 是覆盖不是追加——客户端自己传的
        # X-Upstream-Base-Url 会被这行彻底顶掉，无法把用户 sk 引到野地址。
        # 应用内还有防线 2（allowlist）与防线 3（scheme/userinfo 校验），
        # 因为直连 8000 端口的流量绕过 nginx，不能只靠这一层。
        proxy_set_header X-Upstream-Base-Url "http://newapi:3000";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 必须 > POLL_WAIT_MAX_SECONDS（默认 60），否则长轮询会被
        # nginx 在应用返回 202 之前就掐断，客户端看到 504
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_connect_timeout 5s;

        # 回放的是上游原始字节，不要让 nginx 再缓冲/改写
        proxy_buffering off;
        proxy_request_buffering off;

        # 【客户端自定义头的透传规则】
        # proxy_set_header 是「覆盖」语义——只影响上面显式列出的那几个头，
        # 不是白名单。其余请求头（X-Batch-Key / X-Batch-Size / X-Batch-Wait /
        # Idempotency-Key / X-Callback-Url / X-Delay-Seconds / X-Execute-After …）
        # **默认原样转发给 stask**，不必逐个登记。
        #
        # ⚠️ 唯一的例外是 nginx 默认的 `underscores_in_headers off`：**名字里带下划线的
        #    请求头会被整条丢弃**，且没有任何报错——客户端写 `X_Batch_Key` 会「静默不生效」
        #    （服务端按默认维度归组，202 响应里 batch_key 回落成模型名），排查时极易误判成
        #    应用 bug。自定义头一律用连字符；确需放行下划线头时在本 server 块加：
        #        underscores_in_headers on;
    }

    # ---- 其余全部原样走 new-api ----
    location / {
        proxy_pass http://newapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同步出图本来就慢，给足超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
