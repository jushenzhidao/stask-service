name: stask

# 通用 HTTP 异步任务服务：web（提交/查询）+ worker（执行+定时）+ redis（队列/锁/会话）。
# 没有 mysql 服务——tasks 表复用 new-api 的实例（零建表），
# ST_DATABASE_URL 必须指向 new-api 那个库。

x-app-base: &app-base
  image: ghcr.io/aichatfire/stask-service:latest
  build: .
  restart: unless-stopped
  # .env 必须存在（make setup 会自动生成）
  env_file: .env
  environment:
    ST_REDIS_URL: ${ST_REDIS_URL:-redis://redis:6379/0}
  depends_on:
    redis:
      condition: service_healthy
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  stask:
    <<: *app-base
    ports:
      - "${ST_PORT:-8000}:8000"
    healthcheck:
      # slim 镜像没有 curl，用 python 自带的 urllib
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app-base
    # scheduler 合并进 worker 进程 —— 它必须单副本（多份会重复触发 cron）。
    # 扩 worker 副本时：把 scheduler 拆成独立 service，worker 只跑 `taskiq worker`。
    command: >
      sh -c "taskiq scheduler app.queue:scheduler &
             exec taskiq worker app.queue:broker --max-async-tasks ${ST_QUEUE_CONCURRENCY:-64}"
    healthcheck:
      # worker 无 HTTP 端口，探 Redis 连通性代替（进程死了容器也会退出重启）
      test: ["CMD", "python", "-c",
             "import socket,os;u=os.environ.get('ST_REDIS_URL','redis://redis:6379/0');h=u.split('//')[1].split('/')[0];p=h.split(':');socket.create_connection((p[0],int(p[1]) if len(p)>1 else 6379),timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF everysec 是硬要求：丢失窗口 ≤1s。关掉 AOF 后一次重启会丢掉
    # 全部令牌会话与派发锁，在途任务集体判死；队列走 Redis Stream，
    # 未 ack 的消息也靠 AOF 在重启后存活。
    command: >
      redis-server --appendonly yes --appendfsync everysec
                   --maxmemory ${ST_REDIS_MAXMEMORY:-256mb}
                   --maxmemory-policy noeviction
    ports:
      - "${ST_REDIS_PORT:-6381}:6379"    # 独立端口，与别家实例隔离（ADR-004）
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # 任务看板（可选）：docker compose --profile admin up -d
  # 启用后给 stask/worker 配 ST_TASKIQ_ADMIN_URL=http://taskiq-admin:3000
  # 和 ST_TASKIQ_ADMIN_API_TOKEN=<与下面 TASKIQ_ADMIN_API_TOKEN 相同>。
  taskiq-admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    profiles: ["admin"]
    restart: unless-stopped
    ports:
      - "${ST_TASKIQ_ADMIN_PORT:-3001}:3000"
    environment:
      # 默认值仅为让未启用 profile 时 compose 可整体插值；启用 admin 时务必改掉
      TASKIQ_ADMIN_API_TOKEN: ${ST_TASKIQ_ADMIN_API_TOKEN:-change-me}
    volumes:
      - taskiq-admin-data:/usr/database/
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  redis-data:
  taskiq-admin-data:
