name: stask

services:
  stask:
    build: .
    image: ghcr.io/aichatfire/stask-service:latest
    restart: unless-stopped
    # .env 必须存在（make setup 会自动生成）
    env_file: .env
    environment:
      ST_REDIS_URL: ${ST_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # slim 镜像没有 curl，用 python 自带的 urllib
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 60s

  worker:
    image: ghcr.io/aichatfire/stask-service:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ST_REDIS_URL: ${ST_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    # scheduler 合并进 worker 进程 —— 它必须单副本（多份会重复触发 cron）。
    # 扩 worker 时把 scheduler 拆成独立 service，worker 只跑 `taskiq worker`。
    command: >
      sh -c "taskiq scheduler app.queue:scheduler &
             exec taskiq worker app.queue:broker --max-async-tasks 64"
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF everysec 是硬要求：丢失窗口 ≤1s，残差由定时校准从 tasks 表重建。
    # 关掉 AOF 后一次重启就会丢掉全部令牌会话，在途任务集体转对账。
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      - "6381:6379"           # 独立端口，与 atask 的 6380 隔离（ADR-004）
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

# 注意：没有 mysql 服务 —— tasks 表复用 new-api 的实例（零建表）。
# ST_DATABASE_URL 必须指向 new-api 那个库，否则查不到任何任务行。
