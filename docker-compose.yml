name: stask

# 通用 HTTP 异步任务服务：web（提交/查询）+ worker（执行+定时）+ redis（队列/锁/会话）。
# 没有 mysql 服务——tasks 表复用 new-api 的实例（零建表），
# SQL_DSN 必须指向 new-api 那个库（应用会自动转成 asyncmy 的 URL）。
#
# 【寻址纪律】.env 是**宿主视角**（make run / make standalone 直接读它）。
# 容器内 127.0.0.1 = 容器自己，所以凡涉及网络寻址的项，一律在下面
# x-app-base.environment 里直接写容器网络地址覆盖——不再另设一套
# *_DOCKER 变量，避免同一个地址要同步两处。

x-app-base: &app-base
  image: ghcr.io/jushenzhidao/stask-service:latest
  build: .
  # 强制每次从源码构建，绝不拉远端的 latest。
  # 同时写 image + build 时，`docker compose up`（不带 --build）会用本地或远端
  # 的旧镜像——曾经因此跑着一个 ListQueueBroker 的旧容器去读 Stream 队列，
  # 报 WRONGTYPE。要吃远端镜像请换成明确的版本 tag，不要用 latest。
  pull_policy: build
  restart: unless-stopped
  # required: true（默认）—— .env 缺失时直接报错，而不是静默起一个错配置的服务
  env_file:
    - path: .env
      required: true
  environment:
    # ---- 运行环境（**必填**，`.env` 里缺这一项 compose 直接解析失败）----
    # 为什么必须显式：`app/main.py` 的致命启动校验（CHANNEL_ID / CALLBACK_SECRET /
    # taskiq-admin token）只在**严格环境**生效，而 APP_ENV 的配置默认值是 dev
    # ——「忘了声明」就等于「全部校验静默跳过」，正是这些校验要防的场景。
    # `:?` 沿用上面 TASKIQ_ADMIN_API_TOKEN 的同一惯用法：缺失即报错并说明原因。
    # 生产镜像另外自带 `ENV APP_ENV=prod`（非 compose 的编排如 k8s/docker run
    # 直接吃那个默认值），这里显式声明是为了让 compose 部署不可能「悄悄不是 prod」。
    APP_ENV: ${APP_ENV:?必须显式声明 APP_ENV：prod = 启用致命启动校验；dev/local/test = 只告警}
    # ---- 容器网络寻址（覆盖 .env 里的宿主视角同名项）----
    # 这里的地址只在容器里有效，改动就改这一处。
    REDIS_URL: redis://redis:6379/0
    # 数据库连接：只认 new-api 的 SQL_DSN（Go DSN 格式），应用会自动转成
    # asyncmy 的 URL，Go 专有参数（parseTime/loc/...）会被丢掉。
    # 「或」= 冒号：.env 里 SQL_DSN 没配**或**配成空，才用下面这个容器视角的默认值
    # （host.docker.internal 指向宿主机 MySQL，靠 extra_hosts 映射）。
    SQL_DSN: ${SQL_DSN:-root:change-me@tcp(host.docker.internal:3306)/newapi-for-bff?charset=utf8mb4&parseTime=true}
    # 上游是**业务配置**、会经常换，所以值交给 .env 的 UPSTREAM_BASE_URL 决定
    # （默认走宿主机）。注意：容器里必须填容器可见的地址，且要在
    # UPSTREAM_ALLOWLIST 里，否则提交一律 400。
    UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://host.docker.internal:3000}
    # 任务看板（必选）：URL 与 TOKEN 都非空才挂 middleware，token 在 .env。
    TASKIQ_ADMIN_URL: http://taskiq-admin:3000
  # Linux 上 host.docker.internal 不是内置记录，必须显式指到宿主机网关；
  # Docker Desktop（macOS / Windows）自带该记录，重复声明无害。
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
  # 必须 > gunicorn 的 graceful_timeout（默认 = POLL_WAIT_MAX_SECONDS + 15 = 75s），
  # 否则 Docker 先 SIGKILL，在飞的长轮询请求被硬截断。
  # 把 POLL_WAIT_MAX_SECONDS 调到 60 以上时，这里要同步加大。
  stop_grace_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  stask:
    <<: *app-base
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      # slim 镜像没有 curl，用 python 自带的 urllib
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app-base
    # scheduler 合并进 worker 进程 —— 它必须单副本（多份会重复触发 cron）。
    # 扩 worker 副本时：把 scheduler 拆成独立 service，worker 只跑 `taskiq worker`。
    #
    # 用 bash 包一层是为了**信号转发与故障可见性**：原来的 `... & exec ...`
    # 会让 scheduler 变成孤儿——停机时拿不到 SIGTERM，它自己崩了容器也不会重启。
    # 这里任一子进程退出即整体退出，交给 restart: unless-stopped 拉起。
    #
    # 【转义纪律】compose 对**整份文件**做变量插值，`$name` 和 `${name}` 都吃。
    # 脚本里的 shell 变量必须写成 `$$name`（compose 把 `$$` 还原成 `$`）；
    # 只有 `${QUEUE_CONCURRENCY:-64}` 这种是真要交给 compose 求值的。
    command:
      - bash
      - -c
      - |
        term() { kill -TERM "$$sched" "$$wk" 2>/dev/null || true; }
        trap term TERM INT
        taskiq scheduler app.queue:scheduler &
        sched=$$!
        taskiq worker app.queue:broker --max-async-tasks "${QUEUE_CONCURRENCY:-64}" &
        wk=$$!
        wait -n "$$sched" "$$wk"; rc=$$?
        term
        wait "$$sched" "$$wk" 2>/dev/null || true
        exit "$$rc"
    healthcheck:
      # worker 无 HTTP 端口，探 Redis 连通性代替（进程死了容器也会退出重启）
      test: ["CMD", "python", "-c",
             "import socket,os;u=os.environ.get('REDIS_URL','redis://redis:6379/0');h=u.split('//')[1].split('/')[0];p=h.split(':');socket.create_connection((p[0],int(p[1]) if len(p)>1 else 6379),timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF everysec 是硬要求：丢失窗口 ≤1s。关掉 AOF 后一次重启会丢掉
    # 全部令牌会话与派发锁，在途任务集体判死；队列走 Redis Stream，
    # 未 ack 的消息也靠 AOF 在重启后存活。
    command: >
      redis-server --appendonly yes --appendfsync everysec
                   --maxmemory ${REDIS_MAXMEMORY:-512mb}
                   --maxmemory-policy noeviction
    ports:
      # 只绑 127.0.0.1：compose 内服务走 redis:6379，宿主只有本机 standalone
      # 模式需要它。绑 0.0.0.0 等于把一个无密码的 Redis 暴露到局域网。
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"    # 独立端口，与别家实例隔离（ADR-004）
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # 任务看板（**必选**）：随 docker compose up 一起起，面板在
  # 127.0.0.1:${TASKIQ_ADMIN_PORT}。
  # 上报是 fire-and-forget——面板挂掉只丢事件、不影响任务执行，所以 stask /
  # worker **不设 depends_on**：不该让看板的可用性反向拖住业务进程启动。
  taskiq-admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    restart: unless-stopped
    ports:
      # 面板无鉴权，同样只绑本机；要对外放请前面套一层反向代理做认证
      # （端口来自 .env 的 TASKIQ_ADMIN_PORT）
      - "127.0.0.1:${TASKIQ_ADMIN_PORT:-3001}:3000"
    environment:
      # 必填（`:?` 让缺失时 compose 直接报错并给出原因，而不是默默用弱口令）
      TASKIQ_ADMIN_API_TOKEN: ${TASKIQ_ADMIN_API_TOKEN:?taskiq-admin 已改为必选：请在 .env 配置 TASKIQ_ADMIN_API_TOKEN（openssl rand -base64 24）}
    volumes:
      - taskiq-admin-data:/usr/database/
    healthcheck:
      # 面板是纯前端 + API，探根路径即可；没有 curl 就用 python
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  redis-data:
  taskiq-admin-data:
