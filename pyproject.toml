[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stask-service"
# 版本号唯一事实源 = app/__init__.py 的 __version__（不在这里写死）。
# 三处曾经各写一个数字（pyproject 0.1.0 / config 0.2.0 / 镜像 tag 又不同），
# 于是 /healthz、OpenAPI version、logfire service_version 报的是哪个纯属运气。
dynamic = ["version"]
description = "同步转异步任务网关：给 new-api 同步生成 API 加 /async 前缀即任务化"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn==0.34.0",
    "gunicorn==23.0.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncmy==0.2.10",
    # MySQL 8+ 默认认证插件是 caching_sha2_password，asyncmy 走这条路径时
    # 必须有 cryptography，否则连接直接抛
    # RuntimeError: 'cryptography' package is required...
    # 实测遗漏它的症状是 /healthz/ready 报 db fail: RuntimeError
    "cryptography==44.0.0",
    "redis==8.1.0",       # taskiq-redis 1.2.x 要求 redis>=8；本项目只用基础命令+eval，API 兼容
    "httpx[http2]==0.28.1",
    # opentelemetry extra：内置 OpenTelemetryMiddleware 的依赖（otel-api/psutil）。
    # 0.12 起还内置 TaskiqAdminMiddleware（依赖 aiohttp，核心依赖已含）。
    "taskiq[opentelemetry]==0.12.6",
    "taskiq-redis==1.2.3",
    "loguru==0.7.3",
    # logfire：LOGFIRE_ENABLED=1 时启用；fastapi/httpx extra 是对应插桩包
    "logfire[fastapi,httpx]==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.13",
    "mypy==1.15.0",
    "respx==0.22.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
# 从 app/__init__.py 的模块级字面量静态读取（setuptools 用 AST，不 import 模块）
version = {attr = "app.__version__"}

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# I001 关：import 分组顺序不强制（中文注释块常打断分组）
# RUF001/2/3：中文全角标点在字符串/docstring/注释里是常态，放行
ignore = ["I001", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"app/routers/*" = ["B008"]        # FastAPI Depends(...) 默认参数惯用法
"app/deps/*" = ["B008"]
"app/queue.py" = ["B008"]         # taskiq TaskiqDepends() 同理

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# 2026-09-13 起开启严格模式。此前 `strict = false` 让「裸泛型注解 / 未标注签名 /
# 返回 Any」悄悄累积——实测历史遗留 87 处（其中 81 处只是 `dict` → `dict[str, Any]`），
# 一次性修完。事实是团队本来就在按严格标准写（全仓 305 个函数只差 1 个返回标注），
# 那就让工具来保证它不退化，而不是靠纪律。
# `test_misc.test_mypy_clean` 把它带进了默认门禁（`make check`）。
strict = true
# 第三方没有 stub 的依赖（如 taskiq / taskiq-admin 相关）仍放行
ignore_missing_imports = true
